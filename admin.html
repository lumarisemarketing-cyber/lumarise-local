<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LumaRise Local | Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f3fa;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    header {
      background: linear-gradient(135deg, #5b21b6, #7c3aed);
      color: white;
      padding: 30px;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    header h1 {
      margin-bottom: 8px;
    }

    .login-box {
      max-width: 450px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .login-box h1 {
      color: #5b21b6;
      margin-bottom: 10px;
    }

    .login-box p {
      color: #666;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      background: #5b21b6;
      color: white;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #4c1d95;
    }

    .logout-btn {
      float: right;
      background: white;
      color: #5b21b6;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin: 25px 0;
    }

    .stat-card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 30px;
      color: #5b21b6;
    }

    .businesses {
      display: grid;
      gap: 15px;
    }

    .business-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .business-card h2 {
      color: #5b21b6;
      margin-bottom: 8px;
    }

    .business-card p {
      margin: 5px 0;
      color: #555;
    }

    .badges {
      margin: 12px 0;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-right: 5px;
      background: #eee;
    }

    .verified {
      background: #dcfce7;
      color: #166534;
    }

    .featured {
      background: #fef3c7;
      color: #92400e;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .verify-btn {
      background: #16a34a;
      color: white;
    }

    .unverify-btn {
      background: #dc2626;
      color: white;
    }

    .feature-btn {
      background: #d97706;
      color: white;
    }

    .unfeature-btn {
      background: #6b7280;
      color: white;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

<div id="loginSection" class="login-box">

  <h1>🌟 LumaRise Local</h1>

  <p>Admin Login</p>

  <div id="loginMessage"></div>

  <input
    type="email"
    id="email"
    placeholder="Admin email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button class="login-btn" onclick="login()">
    Login
  </button>

</div>


<div id="adminSection" style="display:none;">

  <div class="container">

    <header>

      <button class="logout-btn" onclick="logout()">
        Logout
      </button>

      <h1>🌟 LumaRise Local Admin</h1>

      <p>Manage businesses listed on LumaRise Local.</p>

    </header>

    <div id="message"></div>

    <section class="stats">

      <div class="stat-card">
        <h3>Total Businesses</h3>
        <strong id="totalBusinesses">0</strong>
      </div>

      <div class="stat-card">
        <h3>Verified Businesses</h3>
        <strong id="verifiedBusinesses">0</strong>
      </div>

      <div class="stat-card">
        <h3>Featured Businesses</h3>
        <strong id="featuredBusinesses">0</strong>
      </div>

    </section>

    <h2 style="margin-bottom:15px;">
      Business Listings
    </h2>

    <div id="loading" class="loading">
      Loading businesses...
    </div>

    <div id="businesses" class="businesses"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://lpbamlwezrkyrjnwgpcp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nY55Pwo4sFioH5B1Er-XAg_n4Y03wml";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if (!email || !password) {

    message.innerHTML = `
      <div class="error">
        Please enter your email and password.
      </div>
    `;

    return;
  }

  const { error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    message.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }

  showAdmin();

}


async function logout() {

  await db.auth.signOut();

  document.getElementById("adminSection").style.display = "none";

  document.getElementById("loginSection").style.display = "block";

}


async function checkLogin() {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (session) {

    showAdmin();

  }

}


function showAdmin() {

  document.getElementById("loginSection").style.display = "none";

  document.getElementById("adminSection").style.display = "block";

  loadBusinesses();

}


async function loadBusinesses() {

  const loading =
    document.getElementById("loading");

  const businessesContainer =
    document.getElementById("businesses");

  try {

    const { data, error } = await db
      .from("businesses")
      .select("*")
      .order("created_at", {
        ascending: false
      });

    if (error) {
      throw error;
    }

    loading.style.display = "none";

    const total = data.length;

    const verified =
      data.filter(
        business => business.is_verified === true
      ).length;

    const featured =
      data.filter(
        business => business.is_featured === true
      ).length;

    document.getElementById(
      "totalBusinesses"
    ).textContent = total;

    document.getElementById(
      "verifiedBusinesses"
    ).textContent = verified;

    document.getElementById(
      "featuredBusinesses"
    ).textContent = featured;


    businessesContainer.innerHTML =
      data.map(business => {

        const verifyButton =
          business.is_verified

          ? `
            <button
              class="unverify-btn"
              onclick="toggleVerified('${business.id}', false)">
              ✕ Remove Verification
            </button>
          `

          : `
            <button
              class="verify-btn"
              onclick="toggleVerified('${business.id}', true)">
              ✓ Verify Business
            </button>
          `;


        const featureButton =
          business.is_featured

          ? `
            <button
              class="unfeature-btn"
              onclick="toggleFeatured('${business.id}', false)">
              ★ Remove Featured
            </button>
          `

          : `
            <button
              class="feature-btn"
              onclick="toggleFeatured('${business.id}', true)">
              ⭐ Feature Business
            </button>
          `;


        return `

          <div class="business-card">

            <h2>
              ${escapeHtml(
                business.business_name ||
                "Unnamed Business"
              )}
            </h2>

            <p>
              <strong>Category:</strong>
              ${escapeHtml(
                business.category ||
                "Not specified"
              )}
            </p>

            <p>
              <strong>Location:</strong>
              ${escapeHtml(
                business.city || ""
              )}
              ${
                business.province
                ? ", " +
                  escapeHtml(
                    business.province
                  )
                : ""
              }
            </p>

            <p>
              <strong>Description:</strong>
              ${escapeHtml(
                business.description ||
                "No description"
              )}
            </p>

            <div class="badges">

              ${
                business.is_verified
                ? '<span class="badge verified">✓ Verified</span>'
                : '<span class="badge">Not Verified</span>'
              }

              ${
                business.is_featured
                ? '<span class="badge featured">⭐ Featured</span>'
                : '<span class="badge">Not Featured</span>'
              }

            </div>

            <div class="actions">

              ${verifyButton}

              ${featureButton}

            </div>

          </div>

        `;

      }).join("");

  } catch (error) {

    console.error(error);

    loading.innerHTML = `
      <div class="error">
        Unable to load businesses.
      </div>
    `;

  }

}


async function toggleVerified(id, newValue) {

  const message =
    document.getElementById("message");

  message.innerHTML = "";

  const {
    data: { session }
  } = await db.auth.getSession();

  if (!session) {

    message.innerHTML = `
      <div class="error">
        Please log in again.
      </div>
    `;

    return;
  }


  const { error } =
    await db
      .from("businesses")
      .update({
        is_verified: newValue
      })
      .eq("id", id);

  if (error) {

    console.error(error);

    message.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  message.innerHTML = `
    <div class="success">
      ✓ Business verification updated successfully.
    </div>
  `;

  await loadBusinesses();

}


async function toggleFeatured(id, newValue) {

  const message =
    document.getElementById("message");

  message.innerHTML = "";

  const {
    data: { session }
  } = await db.auth.getSession();

  if (!session) {

    message.innerHTML = `
      <div class="error">
        Please log in again.
      </div>
    `;

    return;
  }


  const { error } =
    await db
      .from("businesses")
      .update({
        is_featured: newValue
      })
      .eq("id", id);

  if (error) {

    console.error(error);

    message.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  message.innerHTML = `
    <div class="success">
      ✓ Featured status updated successfully.
    </div>
  `;

  await loadBusinesses();

}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


checkLogin();

</script>

</body>
</html>
