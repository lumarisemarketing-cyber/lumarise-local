  <button class="login-btn" onclick="login()">

  </button></div><div id="adminSection" style="display:none;">  <div class="container"><header>

  <button class="logout-btn" onclick="logout()">

  </button>

  <h1>🌟 LumaRise Local Admin</h1>

  <p>
    Manage businesses listed on LumaRise Local.
  </p>

</header>

<div id="message"></div>

<section class="stats">

  <div class="stat-card">
    <h3>Total Businesses</h3>
    <strong id="totalBusinesses">0</strong>
  </div>

  <div class="stat-card pending-stat">
    <h3>Pending Review</h3>
    <strong id="pendingBusinesses">0</strong>
  </div>

  <div class="stat-card approved-stat">
    <h3>Approved</h3>
    <strong id="approvedBusinesses">0</strong>
  </div>

  <div class="stat-card rejected-stat">
    <h3>Rejected</h3>
    <strong id="rejectedBusinesses">0</strong>
  </div>

  <div class="stat-card">
    <h3>Verified</h3>
    <strong id="verifiedBusinesses">0</strong>
  </div>

  <div class="stat-card">
    <h3>Featured</h3>
    <strong id="featuredBusinesses">0</strong>
  </div>

</section>

<h2 class="section-title">
  Business Listings
</h2>

<div id="loading" class="loading">
  Loading businesses...
</div>

<div id="businesses" class="businesses"></div>

  </div></div><script>

const SUPABASE_URL =
  "https://lpbamlwezrkyrjnwgpcp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nY55Pwo4sFioH5B1Er-XAg_n4Y03wml";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if (!email || !password) {

    message.innerHTML = `
      <div class="error">
        Please enter your email and password.
      </div>
    `;

    return;
  }

  const { error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    message.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }

  showAdmin();
}


async function logout() {

  await db.auth.signOut();

  document.getElementById("adminSection").style.display = "none";

  document.getElementById("loginSection").style.display = "block";
}


async function checkLogin() {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (session) {

    showAdmin();

  }
}


function showAdmin() {

  document.getElementById("loginSection").style.display = "none";

  document.getElementById("adminSection").style.display = "block";

  loadBusinesses();
}


async function loadBusinesses() {

  const loading =
    document.getElementById("loading");

  const businessesContainer =
    document.getElementById("businesses");

  try {

    const { data, error } =
      await db
        .from("businesses")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {
      throw error;
    }

    loading.style.display = "none";

    const businesses = data || [];

    const total =
      businesses.length;

    const pending =
      businesses.filter(
        business =>
          (business.approval_status || "pending") === "pending"
      ).length;

    const approved =
      businesses.filter(
        business =>
          business.approval_status === "approved"
      ).length;

    const rejected =
      businesses.filter(
        business =>
          business.approval_status === "rejected"
      ).length;

    const verified =
      businesses.filter(
        business =>
          business.is_verified === true
      ).length;

    const featured =
      businesses.filter(
        business =>
          business.is_featured === true
      ).length;


    document.getElementById(
      "totalBusinesses"
    ).textContent = total;

    document.getElementById(
      "pendingBusinesses"
    ).textContent = pending;

    document.getElementById(
      "approvedBusinesses"
    ).textContent = approved;

    document.getElementById(
      "rejectedBusinesses"
    ).textContent = rejected;

    document.getElementById(
      "verifiedBusinesses"
    ).textContent = verified;

    document.getElementById(
      "featuredBusinesses"
    ).textContent = featured;


    if (businesses.length === 0) {

      businessesContainer.innerHTML = `
        <div class="no-results">
          No businesses have been submitted yet.
        </div>
      `;

      return;
    }


    businessesContainer.innerHTML =
      businesses.map(business => {

        const status =
          business.approval_status || "pending";


        let approvalBadge = "";

        if (status === "approved") {

          approvalBadge = `
            <span class="badge approved">
              ✓ Approved
            </span>
          `;

        } else if (status === "rejected") {

          approvalBadge = `
            <span class="badge rejected">
              ✕ Rejected
            </span>
          `;

        } else {

          approvalBadge = `
            <span class="badge pending">
              ⏳ Pending Review
            </span>
          `;

        }


        const approvalButtons =

          status === "approved"

          ? `
            <button
              class="reject-btn"
              onclick="updateApproval('${business.id}', 'rejected')"
            >
              ✕ Reject Business
            </button>
          `

          : status === "rejected"

          ? `
            <button
              class="approve-btn"
              onclick="updateApproval('${business.id}', 'approved')"
            >
              ✓ Approve Business
            </button>
          `

          : `
            <button
              class="approve-btn"
              onclick="updateApproval('${business.id}', 'approved')"
            >
              ✓ Approve Business
            </button>

            <button
              class="reject-btn"
              onclick="updateApproval('${business.id}', 'rejected')"
            >
              ✕ Reject Business
            </button>
          `;


        const verifyButton =
          business.is_verified

          ? `
            <button
              class="unverify-btn"
              onclick="toggleVerified('${business.id}', false)"
            >
              ✕ Remove Verification
            </button>
          `

          : `
            <button
              class="verify-btn"
              onclick="toggleVerified('${business.id}', true)"
            >
              ✓ Verify Business
            </button>
          `;


        const featureButton =
          business.is_featured

          ? `
            <button
              class="unfeature-btn"
              onclick="toggleFeatured('${business.id}', false)"
            >
              ★ Remove Featured
            </button>
          `

          : `
            <button
              class="feature-btn"
              onclick="toggleFeatured('${business.id}', true)"
            >
              ⭐ Feature Business
            </button>
          `;


        return `

          <div class="business-card">

            <h2>
              ${escapeHtml(
                business.business_name ||
                "Unnamed Business"
              )}
            </h2>

            <p>
              <strong>Category:</strong>
              ${escapeHtml(
                business.category ||
                "Not specified"
              )}
            </p>

            <p>
              <strong>Location:</strong>
              ${escapeHtml(
                business.city || ""
              )}
              ${
                business.province
                ? ", " +
                  escapeHtml(
                    business.province
                  )
                : ""
              }
            </p>

            <p>
              <strong>Description:</strong>
              ${escapeHtml(
                business.description ||
                "No description"
              )}
            </p>

            ${
              business.area
              ? `
                <p>
                  <strong>Area:</strong>
                  ${escapeHtml(
                    business.area
                  )}
                </p>
              `
              : ""
            }

            ${
              business.email
              ? `
                <p>
                  <strong>Email:</strong>
                  ${escapeHtml(
                    business.email
                  )}
                </p>
              `
              : ""
            }

            ${
              business.phone
              ? `
                <p>
                  <strong>Phone:</strong>
                  ${escapeHtml(
                    business.phone
                  )}
                </p>
              `
              : ""
            }

            <div class="owner-info">

              <strong>Owner Account:</strong><br>

              ${
                business.owner_id
                ? "Connected to registered owner account"
                : "No owner account connected"
              }

            </div>

            <div class="badges">

              ${approvalBadge}

              ${
                business.is_verified
                ? `
                  <span class="badge verified">
                    ✓ Verified
                  </span>
                `
                : `
                  <span class="badge">
                    Not Verified
                  </span>
                `
              }

              ${
                business.is_featured
                ? `
                  <span class="badge featured">
                    ⭐ Featured
                  </span>
                `
                : `
                  <span class="badge">
                    Not Featured
                  </span>
                `
              }

            </div>

            <div class="actions">

              ${approvalButtons}

              ${verifyButton}

              ${featureButton}

              <a
                href="business.html?id=${encodeURIComponent(
                  business.id
                )}"
                class="view-btn"
              >
                View Listing
              </a>

            </div>

          </div>

        `;

      }).join("");

  } catch (error) {

    console.error(error);

    loading.innerHTML = `
      <div class="error">
        Unable to load businesses.
        ${escapeHtml(
          error.message ||
          ""
        )}
      </div>
    `;

  }

}


async function updateApproval(id, newStatus) {

  const message =
    document.getElementById("message");

  message.innerHTML = "";


  const {
    data: { session }
  } = await db.auth.getSession();


  if (!session) {

    message.innerHTML = `
      <div class="error">
        Your admin session has expired.
        Please log in again.
      </div>
    `;

    return;
  }


  const actionText =
    newStatus === "approved"
      ? "approve"
      : "reject";


  const confirmed =
    confirm(
      `Are you sure you want to ${actionText} this business?`
    );


  if (!confirmed) {
    return;
  }


  const { error } =
    await db
      .from("businesses")
      .update({
        approval_status: newStatus
      })
      .eq("id", id);


  if (error) {

    console.error(error);

    message.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

    return;
  }


  message.innerHTML = `
    <div class="success">
      ${
        newStatus === "approved"
        ? "✓ Business approved successfully."
        : "✓ Business rejected successfully."
      }
    </div>
  `;


  await loadBusinesses();

}


async function toggleVerified(id, newValue) {

  const message =
    document.getElementById("message");

  message.innerHTML = "";


  const {
    data: { session }
  } = await db.auth.getSession();


  if (!session) {

    message.innerHTML = `
      <div class="error">
        Please log in again.
      </div>
    `;

    return;
  }


  const { error } =
    await db
      .from("businesses")
      .update({
        is_verified: newValue
      })
      .eq("id", id);


  if (error) {

    console.error(error);

    message.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

    return;
  }


  message.innerHTML = `
    <div class="success">
      ✓ Business verification updated successfully.
    </div>
  `;


  await loadBusinesses();

}


async function toggleFeatured(id, newValue) {

  const message =
    document.getElementById("message");

  message.innerHTML = "";


  const {
    data: { session }
  } = await db.auth.getSession();


  if (!session) {

    message.innerHTML = `
      <div class="error">
        Please log in again.
      </div>
    `;

    return;
  }


  const { error } =
    await db
      .from("businesses")
      .update({
        is_featured: newValue
      })
      .eq("id", id);


  if (error) {

    console.error(error);

    message.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

    return;
  }


  message.innerHTML = `
    <div class="success">
      ✓ Featured status updated successfully.
    </div>
  `;


  await loadBusinesses();

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


checkLogin();

</script></body>
