<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Business Sign Up | LumaRise Local</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5fb;
      color: #222;
    }

    .header {
      background: #111;
      padding: 18px 20px;
      text-align: center;
    }

    .logo {
      color: #d4af37;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #111;
      text-align: center;
    }

    .intro {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
    }

    .btn {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #d4af37;
      color: #111;
    }

    .message {
      display: none;
      padding: 14px;
      margin-top: 20px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      background: #e9f8ee;
      color: #176b35;
    }

    .error {
      background: #fdeaea;
      color: #9b1c1c;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #666;
    }

    .login-link a {
      color: #9a7b00;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #555;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .container {
        margin: 25px auto;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="index.html" class="logo">
      LumaRise Local
    </a>
  </header>

  <main class="container">

    <div class="card">

      <h1>Join LumaRise Local</h1>

      <p class="intro">
        Create your business owner account and take control of your
        business listing on LumaRise Local.
      </p>

      <form id="signupForm">

        <label for="fullName">
          Full Name
        </label>

        <input
          type="text"
          id="fullName"
          placeholder="Your full name"
          required
        >

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Enter your password again"
          minlength="6"
          required
        >

        <button
          type="submit"
          class="btn"
          id="signupButton"
        >
          Create Business Account
        </button>

      </form>

      <div
        id="message"
        class="message"
      ></div>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Business Login</a>
      </div>

      <a
        href="index.html"
        class="back"
      >
        ← Back to LumaRise Local
      </a>

    </div>

  </main>

  <script>

    const SUPABASE_URL =
      "https://lpbamlwezrkyrjnwgpcp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_nY55Pwo4sFioH5B1Er-XAg_n4Y03wml";

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form =
      document.getElementById("signupForm");

    const button =
      document.getElementById("signupButton");

    const message =
      document.getElementById("message");

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";
    }

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const fullName =
          document
            .getElementById("fullName")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;

        if (password !== confirmPassword) {

          showMessage(
            "The passwords do not match.",
            "error"
          );

          return;
        }

        button.disabled = true;

        button.textContent =
          "Creating Account...";

        message.style.display = "none";

        try {

          const {
            data,
            error
          } = await db.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                full_name: fullName
              }
            }

          });

          if (error) {
            throw error;
          }

          if (
            data.user &&
            data.session
          ) {

            const {
              error: profileError
            } = await db
              .from("business_owner_profiles")
              .insert({
                id: data.user.id,
                full_name: fullName
              });

            if (profileError) {
              throw profileError;
            }

            showMessage(
              "Your account has been created successfully. You can now continue setting up your business listing.",
              "success"
            );

          } else {

            showMessage(
              "Your account was created. Please check your email to confirm your account before logging in.",
              "success"
            );

          }

          form.reset();

        } catch (error) {

          console.error(
            "Signup error:",
            error
          );

          showMessage(
            error.message ||
            "Unable to create your account. Please try again.",
            "error"
          );

        } finally {

          button.disabled = false;

          button.textContent =
            "Create Business Account";

        }

      }
    );

  </script>

</body>
  </html>
