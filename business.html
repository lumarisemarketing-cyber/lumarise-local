<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Business Profile | LumaRise Local</title>

  <meta name="description" content="View a local business profile on LumaRise Local.">

  <meta name="theme-color" content="#071525">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #071525;
      color: #ffffff;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
    }

    /* NAVIGATION */

    nav {
      background: #091a2d;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      font-size: 19px;
      white-space: nowrap;
    }

    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #d4af37, #f4d77a);
      color: #071525;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
    }

    .brand span {
      color: #d4af37;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-links a {
      color: #e9eef5;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #d4af37;
    }

    .nav-cta {
      padding: 11px 17px;
      border-radius: 8px;
      background: #d4af37;
      color: #071525 !important;
      font-weight: bold;
    }

    /* PROFILE */

    .profile-page {
      padding: 45px 0 80px;
    }

    .back-link {
      display: inline-block;
      color: #00b7b0;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .profile-card {
      background: #10243a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
    }

    .cover {
      height: 300px;
      background: #0b1d30;
      position: relative;
      overflow: hidden;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover.no-cover {
      background:
        radial-gradient(circle at 20% 30%, rgba(0, 183, 176, 0.16), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(212, 175, 55, 0.18), transparent 35%),
        #0b1d30;
    }

    .profile-main {
      padding: 0 35px 35px;
      position: relative;
    }

    .profile-header {
      display: flex;
      gap: 25px;
      align-items: flex-end;
      margin-top: -65px;
      position: relative;
    }

    .profile-logo {
      width: 130px;
      height: 130px;
      flex-shrink: 0;
      border-radius: 18px;
      background: #091a2d;
      border: 5px solid #10243a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-weight: bold;
      font-size: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .profile-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-title {
      padding-bottom: 8px;
      min-width: 0;
    }

    .profile-title h1 {
      font-size: 36px;
      line-height: 1.15;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .category {
      color: #d4af37;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .location {
      color: #9fb0c2;
      font-size: 14px;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: bold;
    }

    .featured-badge {
      background: #d4af37;
      color: #071525;
    }

    .verified-badge {
      background: #00a99d;
      color: white;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1.45fr 0.8fr;
      gap: 25px;
      margin-top: 35px;
    }

    .info-card {
      background: #091a2d;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 25px;
    }

    .info-card h2 {
      font-size: 21px;
      margin-bottom: 15px;
    }

    .description {
      color: #c1ccda;
      white-space: pre-line;
      font-size: 15px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-btn {
      display: block;
      padding: 13px 15px;
      border-radius: 9px;
      background: #10243a;
      border: 1px solid #29415b;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }

    .contact-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .address {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #aebdcd;
      font-size: 14px;
    }

    .not-found {
      text-align: center;
      padding: 80px 20px;
    }

    .not-found h1 {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .not-found p {
      color: #9fb0c2;
      margin-bottom: 25px;
    }

    .btn-primary {
      display: inline-block;
      padding: 13px 21px;
      border-radius: 9px;
      background: #d4af37;
      color: #071525;
      font-weight: bold;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: #9fb0c2;
    }

    /* FOOTER */

    footer {
      background: #050f1b;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 35px 0;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 25px;
      align-items: center;
    }

    .footer-brand {
      color: #d4af37;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .footer-text {
      color: #8193a7;
      font-size: 13px;
    }

    .footer-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: #9eafc0;
      font-size: 13px;
    }

    .footer-links a:hover {
      color: #d4af37;
    }

    @media (max-width: 850px) {

      .nav-inner {
        flex-direction: column;
        padding: 15px 0;
      }

      .nav-links {
        justify-content: center;
        gap: 14px;
      }

      .profile-grid {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 600px) {

      .profile-page {
        padding: 30px 0 60px;
      }

      .cover {
        height: 220px;
      }

      .profile-main {
        padding: 0 18px 25px;
      }

      .profile-header {
        flex-direction: column;
        align-items: flex-start;
        margin-top: -55px;
        gap: 15px;
      }

      .profile-logo {
        width: 110px;
        height: 110px;
      }

      .profile-title h1 {
        font-size: 28px;
      }

      .footer-inner {
        flex-direction: column;
        text-align: center;
      }

      .footer-links {
        justify-content: center;
      }

      .nav-links a {
        font-size: 12px;
      }

      .nav-cta {
        padding: 9px 12px;
      }

    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav>
    <div class="container nav-inner">

      <a href="index.html" class="brand">
        <div class="logo-mark">LR</div>
        <div>LumaRise <span>Local</span></div>
      </a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="list.html" class="nav-cta">List Your Business</a>
      </div>

    </div>
  </nav>


  <!-- PROFILE -->

  <main class="profile-page">

    <div class="container">

      <a href="explore.html" class="back-link">
        ← Back to Explore
      </a>

      <div id="profile">

        <div class="loading">
          Loading business profile...
        </div>

      </div>

    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <div class="container footer-inner">

      <div>

        <div class="footer-brand">
          LumaRise Local
        </div>

        <div class="footer-text">
          Find Local. Support Local. Grow Local.
        </div>

        <div class="footer-text">
          © 2026 LumaRise Local. All rights reserved.
        </div>

      </div>

      <div class="footer-links">

        <a href="index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="list.html">List Your Business</a>

      </div>

    </div>

  </footer>
    <script>

    const SUPABASE_URL =
      "https://lpbamlwezrkyrjnwgpcp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_nY55Pwo4sFioH5B1Er-XAg_n4Y03wml";

    const db =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );

    const id =
      params.get("id");


    function escapeHtml(value) {

      if (!value) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function normaliseWhatsApp(number) {

      if (!number) return "";

      let value =
        String(number)
          .replace(/\s+/g, "")
          .replace(/[^0-9+]/g, "");

      if (value.startsWith("0")) {
        value =
          "27" +
          value.substring(1);
      }

      if (value.startsWith("+")) {
        value =
          value.substring(1);
      }

      return value;

    }


    function websiteUrl(url) {

      if (!url) return "";

      let value =
        String(url).trim();

      if (
        !value.startsWith("http://") &&
        !value.startsWith("https://")
      ) {
        value =
          "https://" + value;
      }

      return value;

    }


    function getLocation(business) {

      return [
        business.area,
        business.city,
        business.province
      ]
        .filter(Boolean)
        .join(", ");

    }


    async function loadBusiness() {

      const profile =
        document.getElementById("profile");


      if (!id) {

        profile.innerHTML = `
          <div class="profile-card">
            <div class="not-found">

              <h1>Business Not Found</h1>

              <p>
                We couldn't find the business profile you're looking for.
              </p>

              <a
                href="explore.html"
                class="btn-primary"
              >
                Explore Businesses
              </a>

            </div>
          </div>
        `;

        return;

      }


      try {

        const { data, error } =
          await db
            .from("businesses")
            .select("*")
            .eq("id", id)
            .single();


        if (error || !data) {
          throw error || new Error("Business not found");
        }


        const business =
          data;


        const location =
          getLocation(business);


        const website =
          websiteUrl(
            business.website
          );


        const whatsapp =
          normaliseWhatsApp(
            business.whatsapp ||
            business.phone
          );


        const coverImage =
          business.cover_image_url ||
          "";


        const logoImage =
          business.logo_url ||
          "";


        const badges = `

          ${
            business.is_featured
              ? `
                <span class="badge featured-badge">
                  ⭐ Featured Business
                </span>
              `
              : ""
          }

          ${
            business.is_verified
              ? `
                <span class="badge verified-badge">
                  ✓ Verified Business
                </span>
              `
              : ""
          }

        `;


        const contactButtons = `

          ${
            business.phone
              ? `
                <a
                  class="contact-btn"
                  href="tel:${escapeHtml(business.phone)}"
                >
                  📞 Call Business
                </a>
              `
              : ""
          }


          ${
            whatsapp
              ? `
                <a
                  class="contact-btn"
                  href="https://wa.me/${whatsapp}"
                  target="_blank"
                  rel="noopener"
                >
                  💬 WhatsApp Business
                </a>
              `
              : ""
          }


          ${
            business.email
              ? `
                <a
                  class="contact-btn"
                  href="mailto:${escapeHtml(business.email)}"
                >
                  ✉️ Email Business
                </a>
              `
              : ""
          }


          ${
            website
              ? `
                <a
                  class="contact-btn"
                  href="${escapeHtml(website)}"
                  target="_blank"
                  rel="noopener"
                >
                  🌐 Visit Website
                </a>
              `
              : ""
          }

        `;


        profile.innerHTML = `

          <div class="profile-card">

            ${
              coverImage
                ? `
                  <div class="cover">
                    <img
                      src="${escapeHtml(coverImage)}"
                      alt="${escapeHtml(business.business_name)}"
                    >
                  </div>
                `
                : `
                  <div class="cover no-cover"></div>
                `
            }


            <div class="profile-main">

              <div class="profile-header">

                <div class="profile-logo">

                  ${
                    logoImage
                      ? `
                        <img
                          src="${escapeHtml(logoImage)}"
                          alt="${escapeHtml(business.business_name)} logo"
                        >
                      `
                      : `
                        ${escapeHtml(
                          business.business_name
                            ? business.business_name
                                .substring(0, 2)
                                .toUpperCase()
                            : "LR"
                        )}
                      `
                  }

                </div>


                <div class="profile-title">

                  ${
                    business.category
                      ? `
                        <div class="category">
                          ${escapeHtml(business.category)}
                        </div>
                      `
                      : ""
                  }


                  <h1>
                    ${escapeHtml(
                      business.business_name
                    )}
                  </h1>


                  ${
                    location
                      ? `
                        <div class="location">
                          📍 ${escapeHtml(location)}
                        </div>
                      `
                      : ""
                  }


                  <div class="badges">
                    ${badges}
                  </div>

                </div>

              </div>


              <div class="profile-grid">

                <div class="info-card">

                  <h2>
                    About This Business
                  </h2>

                  <div class="description">

                    ${
                      escapeHtml(
                        business.description ||
                        "This business has not added a description yet."
                      )
                    }

                  </div>


                  ${
                    business.address
                      ? `
                        <div class="address">
                          <strong>📍 Address</strong><br>
                          ${escapeHtml(
                            business.address
                          )}
                        </div>
                      `
                      : ""
                  }

                </div>


                <div class="info-card">

                  <h2>
                    Contact
                  </h2>

                  <div class="contact-list">

                    ${
                      contactButtons ||
                      `
                        <div class="description">
                          Contact details have not been added yet.
                        </div>
                      `
                    }

                  </div>

                </div>

              </div>

            </div>

          </div>

        `;


        document.title =
          business.business_name +
          " | LumaRise Local";


      } catch (error) {

        console.error(
          "Error loading business:",
          error
        );


        profile.innerHTML = `

          <div class="profile-card">

            <div class="not-found">

              <h1>
                Business Not Found
              </h1>

              <p>
                We couldn't load this business profile.
                Please return to Explore and try again.
              </p>

              <a
                href="explore.html"
                class="btn-primary"
              >
                Explore Businesses
              </a>

            </div>

          </div>

        `;

      }

    }


    loadBusiness();

    </script>
    </body>
</html>
