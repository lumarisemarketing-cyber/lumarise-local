<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Business Owner Dashboard | LumaRise Local</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f3f8;
      color: #222;
    }

    header {
      background: linear-gradient(
        135deg,
        #24103f,
        #5b2485
      );

      color: white;
      padding: 22px 20px;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
    }

    .brand span {
      color: #d8b4fe;
    }

    .logout-btn {
      background: white;
      color: #4b1d70;

      border: none;

      padding: 10px 18px;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;
    }

    .container {
      max-width: 1000px;

      margin: 35px auto;

      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin: 0 0 8px;

      color: #321052;
    }

    .welcome p {
      margin: 0;

      color: #666;
    }

    .card {
      background: white;

      border-radius: 14px;

      padding: 25px;

      margin-bottom: 20px;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.07);
    }

    .card h2 {
      margin-top: 0;

      color: #321052;
    }

    .business-name {
      font-size: 24px;

      font-weight: bold;

      margin-bottom: 10px;
    }

    .business-info {
      color: #666;

      line-height: 1.8;
    }

    .status {
      display: inline-block;

      padding: 7px 13px;

      border-radius: 20px;

      font-size: 13px;

      font-weight: bold;

      margin-top: 15px;
    }

    .status.verified {
      background: #dff6e5;

      color: #16733a;
    }

    .status.pending {
      background: #fff1cc;

      color: #8a5b00;
    }

    .empty {
      text-align: center;

      padding: 25px 10px;
    }

    .empty h3 {
      color: #321052;

      margin-bottom: 8px;
    }

    .empty p {
      color: #666;

      line-height: 1.6;
    }

    .primary-btn {
      display: inline-block;

      background:
        linear-gradient(
          135deg,
          #6d28a8,
          #4b176f
        );

      color: white;

      text-decoration: none;

      border: none;

      padding: 12px 22px;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 15px;
    }

    .secondary-btn {
      display: inline-block;

      background: #f0e8f7;

      color: #4b176f;

      text-decoration: none;

      border: none;

      padding: 11px 20px;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 15px;

      margin-right: 8px;
    }

    .loading {
      text-align: center;

      padding: 40px 10px;

      color: #666;
    }

    .error {
      background: #ffe5e5;

      color: #a30000;

      padding: 15px;

      border-radius: 8px;

      margin-bottom: 20px;

      display: none;

      line-height: 1.6;
    }

    .info-box {
      background: #f3edf8;

      border-left: 4px solid #6d28a8;

      padding: 14px;

      margin-top: 18px;

      border-radius: 5px;

      color: #555;

      line-height: 1.6;
    }

    footer {
      text-align: center;

      color: #777;

      padding: 30px 20px;

      font-size: 14px;
    }

    @media (max-width: 600px) {

      .header-inner {
        flex-direction: column;

        align-items: flex-start;
      }

      .logout-btn {
        width: 100%;
      }

      .card {
        padding: 20px;
      }

    }

  </style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="brand">
      LumaRise <span>Local</span>
    </div>

    <button
      class="logout-btn"
      id="logoutBtn"
    >
      Log Out
    </button>

  </div>

</header>

<main class="container">

  <div class="welcome">

    <h1 id="welcomeTitle">
      Business Owner Dashboard
    </h1>

    <p>
      Manage your business presence on
      LumaRise Local.
    </p>

  </div>

  <div
    id="errorMessage"
    class="error"
  ></div>

  <div
    id="loading"
    class="loading"
  >
    Checking your account...
  </div>

  <div
    id="dashboardContent"
    style="display:none;"
  >

    <div class="card">

      <h2>
        Your Account
      </h2>

      <p>
        <strong>Name:</strong>
        <span id="ownerName">-</span>
      </p>

      <p>
        <strong>Email:</strong>
        <span id="ownerEmail">-</span>
      </p>

    </div>

    <div class="card">

      <h2>
        Your Business
      </h2>

      <div id="businessContent"></div>

    </div>

  </div>

</main>

<footer>

  © 2026 LumaRise Local.
  All rights reserved.

</footer>

<script>

  const SUPABASE_URL =
    "https://lpbamlwezrkyrjnwgpcp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_nY55Pwo4sFioH5B1Er-XAg_n4Y03wml";

  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const loading =
    document.getElementById("loading");

  const dashboardContent =
    document.getElementById("dashboardContent");

  const errorMessage =
    document.getElementById("errorMessage");

  const ownerName =
    document.getElementById("ownerName");

  const ownerEmail =
    document.getElementById("ownerEmail");

  const welcomeTitle =
    document.getElementById("welcomeTitle");

  const businessContent =
    document.getElementById("businessContent");

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

  function showError(message) {

    errorMessage.textContent = message;

    errorMessage.style.display = "block";

  }

  async function loadDashboard() {

    try {

      const {
        data,
        error
      } = await db.auth.getUser();

      if (error) {
        throw error;
      }

      const user = data.user;

      if (!user) {

        window.location.replace("login.html");

        return;

      }

      const name =
        user.user_metadata &&
        user.user_metadata.full_name
          ? user.user_metadata.full_name
          : (
              user.email
                ? user.email.split("@")[0]
                : "Business Owner"
            );

      ownerName.textContent = name;

      ownerEmail.textContent =
        user.email || "-";

      welcomeTitle.textContent =
        "Welcome, " + name + "!";

      const {
        data: businesses,
        error: businessError
      } = await db
        .from("businesses")
        .select("*")
        .eq("owner_id", user.id);

      if (businessError) {
        throw businessError;
      }

      loading.style.display = "none";

      dashboardContent.style.display = "block";

      if (
        !businesses ||
        businesses.length === 0
      ) {

        businessContent.innerHTML = `

          <div class="empty">

            <h3>
              You haven't added a business yet.
            </h3>

            <p>
              Add your business to create
              your LumaRise Local listing.
            </p>

            <a
              href="owner-business.html"
              class="primary-btn"
            >
              Add My Business
            </a>

          </div>

        `;

        return;

      }

      const business =
        businesses[0];

      const verificationStatus =
        business.is_verified
          ? `
            <span class="status verified">
              ✓ Verified Business
            </span>
          `
          : `
            <span class="status pending">
              Pending Verification
            </span>
          `;

      businessContent.innerHTML = `

        <div class="business-name">

          ${escapeHtml(
            business.business_name ||
            "Your Business"
          )}

        </div>

        <div class="business-info">

          ${
            business.description
              ? `
                <strong>Description:</strong><br>
                ${escapeHtml(
                  business.description
                )}
                <br><br>
              `
              : ""
          }

          ${
            business.category
              ? `
                <strong>Category:</strong>
                ${escapeHtml(
                  business.category
                )}
                <br>
              `
              : ""
          }

          ${
            business.province
              ? `
                <strong>Province:</strong>
                ${escapeHtml(
                  business.province
                )}
                <br>
              `
              : ""
          }

          ${
            business.city
              ? `
                <strong>City:</strong>
                ${escapeHtml(
                  business.city
                )}
                <br>
              `
              : ""
          }

          ${
            business.area
              ? `
                <strong>Area:</strong>
                ${escapeHtml(
                  business.area
                )}
                <br>
              `
              : ""
          }

          ${
            business.address
              ? `
                <strong>Address:</strong>
                ${escapeHtml(
                  business.address
                )}
                <br>
              `
              : ""
          }

          ${
            business.phone
              ? `
                <strong>Phone:</strong>
                ${escapeHtml(
                  business.phone
                )}
                <br>
              `
              : ""
          }

          ${
            business.whatsapp
              ? `
                <strong>WhatsApp:</strong>
                ${escapeHtml(
                  business.whatsapp
                )}
                <br>
              `
              : ""
          }

          ${
            business.email
              ? `
                <strong>Email:</strong>
                ${escapeHtml(
                  business.email
                )}
                <br>
              `
              : ""
          }

          ${
            business.website
              ? `
                <strong>Website:</strong>
                ${escapeHtml(
                  business.website
                )}
                <br>
              `
              : ""
          }

        </div>

        ${verificationStatus}

        <div class="info-box">

          Your business listing is connected
          to your owner account.

          ${
            business.is_verified
              ? "Your business has been verified."
              : "Your listing is waiting for verification by LumaRise Local."
          }

        </div>

        <div>

          <a
            href="business.html?id=${encodeURIComponent(
              business.id
            )}"
            class="secondary-btn"
          >
            View My Listing
          </a>

          <a
            href="owner-edit.html"
            class="primary-btn"
          >
            Edit My Business
          </a>

        </div>

      `;

    } catch (error) {

      console.error(
        "Dashboard error:",
        error
      );

      loading.style.display = "none";

      dashboardContent.style.display =
        "block";

      showError(
        "We could not load your business information. " +
        (
          error.message ||
          "Please try again."
        )
      );

    }

  }

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async function() {

        await db.auth.signOut();

        window.location.replace(
          "login.html"
        );

      }
    );

  loadDashboard();

</script>

</body>

</html>
