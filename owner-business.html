<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Your Business | LumaRise Local</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f3f8;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #24103f, #5b2485);
      color: white;
      padding: 22px 20px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
    }

    .brand span {
      color: #d8b4fe;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 25px;
    }

    .intro h1 {
      color: #321052;
      margin-bottom: 8px;
    }

    .intro p {
      color: #666;
      line-height: 1.6;
    }

    .form-card {
      background: white;
      border-radius: 15px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .section-title {
      color: #321052;
      font-size: 19px;
      font-weight: bold;
      margin: 25px 0 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    .required {
      color: #a00000;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #6d28a8;
      box-shadow: 0 0 0 2px rgba(109,40,168,0.12);
    }

    .help-text {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
    }

    .success {
      background: #e3f7e8;
      color: #176b32;
    }

    .submit-btn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #6d28a8, #4b176f);
      color: white;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      opacity: 0.95;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cancel-btn {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #5b2485;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .form-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      LumaRise <span>Local</span>
    </div>

    <a href="dashboard.html" class="back-btn">
      ← Dashboard
    </a>

  </div>
</header>


<main class="container">

  <div class="intro">

    <h1>Add Your Business</h1>

    <p>
      Create your business listing on LumaRise Local and
      help customers discover your business.
    </p>

  </div>


  <div class="form-card">

    <div id="errorMessage" class="message error"></div>

    <div id="successMessage" class="message success"></div>


    <form id="businessForm">

      <div class="section-title">
        Business Information
      </div>


      <div class="form-group">

        <label for="business_name">
          Business Name <span class="required">*</span>
        </label>

        <input
          type="text"
          id="business_name"
          required
          placeholder="Enter your business name"
        >

      </div>


      <div class="form-group">

        <label for="description">
          Business Description
        </label>

        <textarea
          id="description"
          placeholder="Tell customers about your business..."
        ></textarea>

      </div>


      <div class="form-group">

        <label for="category">
          Category <span class="required">*</span>
        </label>

        <input
          type="text"
          id="category"
          required
          placeholder="Example: Restaurant, Construction, Beauty"
        >

      </div>


      <div class="section-title">
        Location
      </div>


      <div class="form-group">

        <label for="province">
          Province <span class="required">*</span>
        </label>

        <select id="province" required>

          <option value="">Select Province</option>

          <option value="Eastern Cape">Eastern Cape</option>
          <option value="Free State">Free State</option>
          <option value="Gauteng">Gauteng</option>
          <option value="KwaZulu-Natal">KwaZulu-Natal</option>
          <option value="Limpopo">Limpopo</option>
          <option value="Mpumalanga">Mpumalanga</option>
          <option value="Northern Cape">Northern Cape</option>
          <option value="North West">North West</option>
          <option value="Western Cape">Western Cape</option>

        </select>

      </div>


      <div class="form-group">

        <label for="city">
          City / Town <span class="required">*</span>
        </label>

        <input
          type="text"
          id="city"
          required
          placeholder="Example: Johannesburg"
        >

      </div>


      <div class="form-group">

        <label for="area">
          Area / Suburb
        </label>

        <input
          type="text"
          id="area"
          placeholder="Example: Randhart"
        >

      </div>


      <div class="form-group">

        <label for="address">
          Business Address
        </label>

        <textarea
          id="address"
          placeholder="Enter your business address"
        ></textarea>

      </div>


      <div class="section-title">
        Contact Details
      </div>


      <div class="form-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="Example: 011 123 4567"
        >

      </div>


      <div class="form-group">

        <label for="whatsapp">
          WhatsApp Number
        </label>

        <input
          type="tel"
          id="whatsapp"
          placeholder="Example: 082 123 4567"
        >

      </div>


      <div class="form-group">

        <label for="email">
          Business Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="business@example.com"
        >

      </div>


      <div class="form-group">

        <label for="website">
          Website
        </label>

        <input
          type="url"
          id="website"
          placeholder="https://example.com"
        >

        <div class="help-text">
          Include https:// if possible.
        </div>

      </div>


      <button
        type="submit"
        class="submit-btn"
        id="submitBtn"
      >
        Submit My Business
      </button>


      <a
        href="dashboard.html"
        class="cancel-btn"
      >
        Cancel and return to dashboard
      </a>

    </form>

  </div>

</main>


<footer>
  © 2026 LumaRise Local. All rights reserved.
</footer>


<script>

  const SUPABASE_URL =
    "https://lpbamlwezrkyrjnwgpcp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_nY55Pwo4sFioH5B1Er-XAg_n4Y03wml";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  const form =
    document.getElementById("businessForm");

  const submitBtn =
    document.getElementById("submitBtn");

  const errorMessage =
    document.getElementById("errorMessage");

  const successMessage =
    document.getElementById("successMessage");


  function showError(message) {

    errorMessage.textContent = message;

    errorMessage.style.display = "block";

    successMessage.style.display = "none";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  function showSuccess(message) {

    successMessage.textContent = message;

    successMessage.style.display = "block";

    errorMessage.style.display = "none";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  async function checkLogin() {

    const {
      data: { user },
      error
    } = await db.auth.getUser();


    if (error || !user) {

      window.location.href = "login.html";

      return null;

    }


    return user;

  }


  form.addEventListener("submit", async function(event) {

    event.preventDefault();


    errorMessage.style.display = "none";
    successMessage.style.display = "none";


    submitBtn.disabled = true;

    submitBtn.textContent =
      "Submitting...";


    try {

      const user = await checkLogin();


      if (!user) {
        return;
      }


      /*
        Make sure this account does not already
        have a business listing.
      */

      const {
        data: existingBusinesses,
        error: existingError
      } = await db
        .from("businesses")
        .select("id")
        .eq("owner_id", user.id);


      if (existingError) {
        throw existingError;
      }


      if (
        existingBusinesses &&
        existingBusinesses.length > 0
      ) {

        showError(
          "This account already has a business listing. Please use your dashboard to manage it."
        );

        submitBtn.disabled = false;

        submitBtn.textContent =
          "Submit My Business";

        return;

      }


      /*
        Collect form information.
      */

      const businessData = {

        business_name:
          document
            .getElementById("business_name")
            .value
            .trim(),

        description:
          document
            .getElementById("description")
            .value
            .trim(),

        category:
          document
            .getElementById("category")
            .value
            .trim(),

        province:
          document
            .getElementById("province")
            .value,

        city:
          document
            .getElementById("city")
            .value
            .trim(),

        area:
          document
            .getElementById("area")
            .value
            .trim(),

        phone:
          document
            .getElementById("phone")
            .value
            .trim(),

        whatsapp:
          document
            .getElementById("whatsapp")
            .value
            .trim(),

        email:
          document
            .getElementById("email")
            .value
            .trim(),

        website:
          document
            .getElementById("website")
            .value
            .trim(),

        address:
          document
            .getElementById("address")
            .value
            .trim(),

        owner_id: user.id,

        is_verified: false,

        is_featured: false

      };


      /*
        Submit the business.
      */

      const {
        data,
        error
      } = await db
        .from("businesses")
        .insert([businessData])
        .select()
        .single();


      if (error) {
        throw error;
      }


      showSuccess(
        "Your business has been submitted successfully! It is now linked to your account."
      );


      form.reset();


      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 2000);


    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        "Something went wrong while submitting your business."
      );

    }


    submitBtn.disabled = false;

    submitBtn.textContent =
      "Submit My Business";

  });


  /*
    Make sure the page is only accessible
    to logged-in users.
  */

  checkLogin();

</script>

</body>
        </html>
